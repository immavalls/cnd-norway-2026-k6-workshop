# For configuration options, see
#   https://grafana.com/docs/grafana/latest/administration/provisioning/#example-data-source-config-file
apiVersion: 1

# Loki, Tempo, and Pyroscope are provisioned inside otel-lgtm itself.
# Prometheus is too, but we override it here to set a 10s scrape interval (the image default is 60s).
# k6 pushes metrics every 5s and Alloy scrapes PostgreSQL every 10s, so Grafana can query with a
# 10s step and the dashboards fill in within a minute instead of one point per minute.
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 10s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Postgres
    type: postgres
    uid: postgres
    access: proxy
    isDefault: false
    url: quickpizza-db:5432
    user: postgres
    secureJsonData:
      password: 'postgres'
    jsonData:
      database: quickpizza_db
      sslmode: 'disable' # disable/require/verify-ca/verify-full
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      postgresVersion: 1801
